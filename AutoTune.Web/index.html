<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTune Studio - Autenticación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card-custom { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; width: 100%; max-width: 420px; }
        .btn-success-custom { background-color: #00e676; color: #000; font-weight: bold; border: none; }
        .btn-success-custom:hover { background-color: #00c853; color: #000; }
    </style>
</head>
<body>

    <div class="card card-custom p-4">
        <h2 class="text-center text-success mb-4" id="form-title">AutoTune Studio</h2>
        <div id="status-msg" class="alert d-none text-center" role="alert"></div>

        <!-- HU-02: Inicio de Sesión -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="login-email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control bg-dark text-white border-secondary" id="login-email" required>
            </div>
            <div class="mb-3">
                <label for="login-password" class="form-label">Contraseña</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-success-custom w-100 mb-3" id="btn-login">Iniciar Sesión</button>
            <p class="text-center mb-0">¿No tienes cuenta? <a href="#" onclick="toggleAuthMode(true)" class="text-success">Regístrate</a></p>
        </form>

        <!-- HU-01: Registro de Usuarios -->
        <form id="register-form" class="d-none" onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label for="reg-nombre" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" id="reg-nombre" required>
            </div>
            <div class="mb-3">
                <label for="reg-email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control bg-dark text-white border-secondary" id="reg-email" required>
            </div>
            <div class="mb-3">
                <label for="reg-password" class="form-label">Contraseña</label>
                <input type="password" class="form-control bg-dark text-white border-secondary" id="reg-password" required>
            </div>
            <div class="mb-3">
                <label for="reg-rol" class="form-label">Rol de Usuario</label>
                <select class="form-select bg-dark text-white border-secondary" id="reg-rol" required>
                    <option value="Cliente">Cliente</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Encargado de Almacén">Encargado de Almacén</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success-custom w-100 mb-3" id="btn-register">Registrarse</button>
            <p class="text-center mb-0">¿Ya tienes cuenta? <a href="#" onclick="toggleAuthMode(false)" class="text-success">Inicia Sesión</a></p>
        </form>
    </div>

    <script>
        function toggleAuthMode(isRegister) {
            document.getElementById('status-msg').classList.add('d-none');
            document.getElementById('login-form').classList.toggle('d-none', isRegister);
            document.getElementById('register-form').classList.toggle('d-none', !isRegister);
            document.getElementById('form-title').innerText = isRegister ? "Registro de Usuario" : "AutoTune Studio";
        }

        function showStatus(message, isError = false) {
            const msg = document.getElementById('status-msg');
            msg.className = `alert text-center ${isError ? 'alert-danger' : 'alert-success'}`;
            msg.innerText = message;
            msg.classList.remove('d-none');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const users = JSON.parse(localStorage.getItem('usuarios_db') || '[]');
            const user = users.find(u => u.email === email);

            if (user) {
                localStorage.setItem('usuario', JSON.stringify(user));
                showStatus("Inicio de sesión exitoso. Redirigiendo...");
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            } else {
                // Login por defecto si no existe en local DB
                const newUser = { nombre: email.split('@')[0], email, rol: 'Cliente', telefono: '809-555-0199' };
                localStorage.setItem('usuario', JSON.stringify(newUser));
                window.location.href = 'dashboard.html';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const email = document.getElementById('reg-email').value;
            const rol = document.getElementById('reg-rol').value;

            const users = JSON.parse(localStorage.getItem('usuarios_db') || '[]');
            if (users.some(u => u.email === email)) {
                showStatus("El correo ya se encuentra registrado.", true);
                return;
            }

            const newUser = { nombre, email, rol, telefono: '' };
            users.push(newUser);
            localStorage.setItem('usuarios_db', JSON.stringify(users));
            localStorage.setItem('usuario', JSON.stringify(newUser));

            showStatus("Registro exitoso. Redirigiendo...");
            setTimeout(() => window.location.href = 'dashboard.html', 800);
        }
    </script>
</body>
</html>
