<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AutoTune Studio Manager - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white container py-5">
    <div class="row justify-content-center">
        <div class="col-md-4 bg-secondary p-4 rounded">
            <h3 class="text-center mb-4">AutoTune Studio</h3>
            
            <div class="mb-3">
                <label>Correo Electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="admin@autotune.com">
            </div>
            
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="123456">
            </div>
            
            <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
            <div id="mensaje" class="mt-3 text-center fw-bold"></div>
        </div>
    </div>

    <script>
    async function login() {
        const email = document.getElementById('email').value;
        const passwordHash = document.getElementById('password').value;
        const mensajeDiv = document.getElementById('mensaje');

        try {
            const response = await fetch('http://localhost:5090/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, passwordHash: passwordHash })
            });

            const data = await response.json();

            if (response.ok) {
                mensajeDiv.className = 'mt-3 text-center text-success';
                mensajeDiv.innerText = `${data.mensaje} Bienvenido ${data.usuario.nombre}`;

                // Guardar la información del usuario en el navegador
                localStorage.setItem('usuario', JSON.stringify(data.usuario));

                // Redirigir al dashboard después de 1 segundo
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                mensajeDiv.className = 'mt-3 text-center text-danger';
                mensajeDiv.innerText = data.mensaje;
            }
        } catch (error) {
            mensajeDiv.className = 'mt-3 text-center text-warning';
            mensajeDiv.innerText = 'Error al conectar con el servidor Backend.';
        }
    }
</script>
</body>
</html>
