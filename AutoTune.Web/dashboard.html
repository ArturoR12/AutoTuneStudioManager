<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AutoTune Studio - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white p-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 id="bienvenida">Panel de Control</h1>
            <button onclick="logout()" class="btn btn-outline-danger">Cerrar Sesión</button>
        </div>
        <p class="lead">Bienvenido al sistema de gestión de AutoTune Studio.</p>
    </div>

    <script>
        // Validar que el usuario haya iniciado sesión
        const usuarioData = localStorage.getItem('usuario');
        if (!usuarioData) {
            window.location.href = 'index.html';
        } else {
            const usuario = JSON.parse(usuarioData);
            document.getElementById('bienvenida').innerText = `Panel de Control - ${usuario.nombre} (${usuario.rol})`;
        }

        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
